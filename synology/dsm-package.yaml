schema: 2
package: SynoPkgVaultwarden
version: 1.37.4
build: 10
displayname: Vaultwarden
icon: assets/icon.png
description: Store and manage passwords and secure notes in an encrypted vault
maintainer: Daniel García
metadata:
  maintainer_url: https://github.com/dani-garcia/vaultwarden
  distributor: Syno Package Land
  distributor_url: https://synopkgland.com/
os_min_ver: "7.2.1-69057"
arches: [x86_64]
install:
  settings:
    public_origin: {type: https-origin, label: Public HTTPS origin (include port 29443), required: true}
entry: admin-only
capabilities: {}
compose:
  sdk: 0.32.0
  files: [compose.yaml]
  web: {service: vaultwarden, port: 29800, health: {path: /alive, status: 200}}
  network: {egress: internet}
  services:
    vaultwarden:
      network: host
      address_env: ROCKET_ADDRESS
      storage_init:
        directories: [{base: /var/tmp, path: vaultwarden}]
        runtime:
          environment:
            DOMAIN: {external_origin: true, setting: public_origin}
            SSO_CLIENT_SECRET: {oidc_client: vaultwarden}
identity_gateway:
  upstream_auth_paths: [/api, /identity, /notifications, /attachments, /events, /icons]
  sdk: 0.32.0
  external_access: {connect: optional, origin_change: confirm, single_origin: true}
  mode: oidc
  access: dsm-admins
  launch_path: /#/sso?identifier=00000000-01DC-01DC-01DC-000000000000
  listen: {https: 29443}
  email_domain: dsm.invalid
  oidc:
    native_login: true
    issuer_port: 29090
    clients:
      - id: vaultwarden
        redirect_paths: [/identity/connect/oidc-signin]
        pkce: true
ui: {launch: new-page}
i18n:
  info:
    zh-TW:
      description: 在加密保險庫中儲存與管理密碼和安全筆記
