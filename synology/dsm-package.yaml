schema: 2
package: SynoPkgVaultwarden
version: 1.37.4
build: 18
displayname: Vaultwarden
icon: assets/icon.png
description: Store and manage passwords and secure notes in an encrypted vault
maintainer: Daniel García
metadata:
  changelog:
    en: "Show HTTPS guidance when opening the web vault over HTTP"
    zh-TW: "以 HTTP 開啟網頁保險庫時顯示 HTTPS 引導"
    zh-CN: "通过 HTTP 打开网页密码库时显示 HTTPS 引导"
    ja: "HTTP で Web 保管庫を開く際に HTTPS の案内を表示"
    ko: "HTTP로 웹 보관함을 열 때 HTTPS 안내 표시"
    de: "HTTPS-Hinweis beim Öffnen des Web-Tresors über HTTP anzeigen"
    fr: "Afficher les instructions HTTPS à l’ouverture du coffre web en HTTP"
  maintainer_url: https://github.com/dani-garcia/vaultwarden
  distributor: Syno Package Land
  distributor_url: https://synopkgland.com/
os_min_ver: "7.2.1-69057"
arches: [x86_64]
install:
  ports: true
  settings:
    public_origin: {type: https-origin, label: DSM HTTPS origin, required: true}
entry: admin-only
capabilities: {}
compose:
  sdk: 0.50.8
  files: [compose.yaml]
  web: {service: vaultwarden, port: 29800, health: {path: /synopkgland/SynoPkgVaultwarden/alive, status: 200}}
  network: {egress: internet}
  services:
    vaultwarden:
      network: host
      address_env: ROCKET_ADDRESS
      storage_init:
        directories: [{base: /var/tmp, path: vaultwarden}]
        runtime:
          environment:
            VAULTWARDEN_ORIGIN: {external_origin: true, setting: public_origin}
            SSO_CLIENT_SECRET: {oidc_client: vaultwarden}
            SSO_ISSUER_PORT: {port: oidc_issuer}
          # Native ENV_FILE expansion keeps both DOMAIN and SSO on the package path.
          files:
            - target: /var/tmp/vaultwarden/sso.env
              content: "DOMAIN=${VAULTWARDEN_ORIGIN}/synopkgland/SynoPkgVaultwarden\nSSO_AUTHORITY=http://127.0.0.1:${SSO_ISSUER_PORT}\n"
identity_gateway:
  # Native clients use these without DSM cookies. Browser-only /identity/connect/authorize and
  # /identity/connect/oidc-signin keep the DSM gate, which rewrites the loopback issuer redirect.
  upstream_auth_paths: [/api, /identity/connect/token, /identity/accounts, /identity/sso, /notifications, /attachments, /events, /icons]
  sdk: 0.50.8
  secure_context: required
  mode: oidc
  access: dsm-admins
  launch_path: /#/sso?identifier=00000000-01DC-01DC-01DC-000000000000
  ingress: {path: /synopkgland/SynoPkgVaultwarden/}
  email_domain: dsm.invalid
  oidc:
    native_login: true
    issuer_port: 29090
    clients:
      - id: vaultwarden
        redirect_paths: [/identity/connect/oidc-signin]
        pkce: true
ui: {launch: new-page}
i18n:
  info:
    zh-TW:
      description: 在加密保險庫中儲存與管理密碼和安全筆記
